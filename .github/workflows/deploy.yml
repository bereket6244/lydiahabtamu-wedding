name: Deploy to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check gallery scripts
        run: |
          node --check assets/guest-gallery.js
          php -l api/gallery.php
          php -l api/gallery-lib.php
          php -l api/photos.php
          php tests/gallery-preview.php
          node tests/gallery-api.mjs

      - name: Deploy public files via cPanel API
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR }}
          DEPLOY_SOURCE_DIR: .
        run: node scripts/deploy-cpanel.mjs
